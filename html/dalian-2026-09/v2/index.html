<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#075b70"><title>大连 3 天｜东港亲子美食攻略</title><link rel="stylesheet" href="assets/css/trip.css"></head><body><main class="shell"><header class="hero"><div class="eyebrow">2026.09.12 — 09.14 · 东港住两晚</div><h1>大连 3 天<br>吃好，也走得松</h1><p>亲子优先：中山—东港、莲花山—星海、自然博物馆收尾。按时间走，不把备选塞进主线。</p></header><a class="map-link" href="map.html?day=d1"><span><strong>打开真实高德路线地图</strong><small>按天看确认行程；点击任一步骤或地图编号查看点位信息与导航。</small></span><b>›</b></a><section><h2 class="section-title">确认行程</h2><p class="hint">点“真实高德路线地图”可按当天路线、候选点和地图标记查看；首页保留最清晰的小时顺序。</p><div id="days"></div></section><section><h2 class="section-title">出发前只确认四件事</h2><div class="notice"><b>民宿：</b>替换为精确高德门牌；<b>餐厅：</b>正黄旗、樱木千鹤先看取号/订位；<b>天气：</b>莲花山遇风雨切换博物馆；<b>返程：</b>确认 14:00 是离开市区、到机场还是起飞。</div></section></main><script src="assets/js/itinerary-data.js"></script><script>const icon={stay:'⌂',food:'■',sight:'●',coffee:'◆',market:'⬡'};const host=document.querySelector('#days');host.innerHTML=Object.entries(DALIAN_TRIP.days).map(([id,d])=>`<article class="day-card" style="--day:${d.color}"><header class="day-head"><span>${d.label}</span><h2>${d.title}</h2></header>${d.stops.map((s,i)=>`<div class="stop"><time>${s.time}</time><div><b>${icon[s.kind]||'•'} ${s.label}</b>${s.budget?`<span class="pill">${s.budget}</span>`:''}<p>${s.info}</p></div></div>`).join('')}<a class="map-link" style="margin:12px 14px;background:${d.color}" href="map.html?day=${id}"><span><strong>在地图查看 ${d.label}</strong><small>路线、门店、候选点与导航</small></span><b>›</b></a></article>`).join('');</script></body></html>
